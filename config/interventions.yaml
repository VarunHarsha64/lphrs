# Hand-authored recommendation templates (build plan 4.6).
# Fields:
#   id, domain, title
#   tags:              descriptive tags (preference matching, synergy lookups)
#   intensity:         1 (very light) .. 5 (very hard)
#   minutes:           minutes per day the user needs to spend
#   effort:            effort cost in [0, 1] (term C)
#   targets:           metric keys from metrics.yaml this item aims to improve
#   goals:             user goals it serves
#   contraindications: tags SafetyFilter checks (see safety_rules.yaml)
# Domains: nutrition, fitness, sleep, lifestyle, preventive_care, wellness.
# Wording is wellness guidance, never diagnosis or prescription.

interventions:
