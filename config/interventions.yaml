# Recipe candidates (built in Phase 4 from RAW_recipes.csv).
# Food.com nutrition column: [calories, total_fat_pdv, sugar_pdv, sodium_pdv, protein_pdv, sat_fat_pdv, carbs_pdv]
recipes:
  sample_size: 5000
  min_minutes: 5                   # shorter entries are mostly drinks and garnishes
  # Food.com meal-type tags: keep actual meals, drop condiments, desserts, drinks, dips, snacks
  include_meal_tags: [main-dish, breakfast, lunch, side-dishes, salads, soups-stews, brunch, one-dish-meal]
  exclude_meal_tags: [condiments-etc, sauces, desserts, beverages, cocktails, dips, spreads, candy,
                      cookies-and-brownies, cakes, salad-dressings, appetizers, snacks]
  max_minutes: 60
  # wellness recipes only: no alcohol, no processed meat (one of our own templates says to limit it)
  exclude_ingredient_keywords: [vodka, gin, rum, tequila, whiskey, whisky, bourbon, brandy, liqueur, schnapps,
                                cognac, vermouth, champagne, wine, beer, sake, triple sec, kahlua, amaretto,
                                hot dog, frankfurter, wiener, bacon, sausage, ham, salami, pepperoni, bologna, spam,
                                chorizo, prosciutto, pastrami, corned beef, kielbasa, bratwurst, pancetta, jerky,
                                luncheon meat, deli meat, lunch meat]
  # substrings that are NOT those words: "gin" in ginger / extra virgin, "rum" in breadcrumbs / drumsticks / rump,
  # "wine" in wine vinegar, "ham" in hamburger / graham / chamomile (applied to all recipe keyword lists above)
  keyword_exceptions: [ginger, virgin, original, crumb, drumstick, rump, wine vinegar, chamomile, hamburger,
                       graham, hamachi]
  domain: nutrition
  intensity: 1
  effort_per_minute: 0.01          # effort = min(1, minutes * effort_per_minute)
  diet_tags:                       # tag: rule on percent-daily-value columns / ingredients
    low_sodium:   {field: sodium_pdv,  max: 10}
    low_sugar:    {field: sugar_pdv,   max: 10}
    high_protein: {field: protein_pdv, min: 30}
    vegetarian:   {exclude_ingredient_keywords: [beef, pork, chicken, turkey, lamb, bacon, ham, sausage, fish, salmon, tuna, shrimp, crab, anchov, gelatin, veal, duck, prosciutto, pepperoni, chorizo, lobster, clam, mussel, oyster, scallop]}
  diet_tag_targets:                # metrics a diet tag is assumed to help
    low_sodium:   [systolic_bp, diastolic_bp]
    low_sugar:    [glucose, hba1c, bmi]
    high_protein: [bmi, body_weight]
    vegetarian:   [ldl, total_cholesterol]
  diet_tag_goals:
    low_sodium:   [lower_bp]
    low_sugar:    [glucose_control, weight_loss]
    high_protein: [weight_loss]
    vegetarian:   [lower_bp, weight_loss]

# Preference vocabularies used by synth_lifestyle.py and preference matching (term P)
preferences:
  diet_styles:
    omnivore:      [heart_healthy, plant_protein, fish]
    vegetarian:    [vegetarian, plant_protein]
    mediterranean: [heart_healthy, fish, vegetables, whole_grain]
    low_carb:      [low_sugar, low_gi, high_protein]
  exercise_types: [walking, cycling, swimming, running, strength, yoga, dance, hiit, tai_chi]
