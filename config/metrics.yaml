# Per-metric definitions used by normalisation, the temporal engine and the ranker.
#   loinc:          code in Synthea observations.csv (verify against the export in Phase 2)
#   unit:           canonical unit after normalisation
#   alt_units:      accepted source units -> multiplier into the canonical unit
#   valid_range:    [min, max]; values outside are dropped as impossible
#   threshold:      theta for time-to-threshold urgency (build plan 5.2)
#   bad_direction:  "up" = rising is bad, "down" = falling is bad
#   goals:          user goals this metric is relevant to
# Thresholds are simplified illustrations, not clinically reviewed.

metrics:
  systolic_bp:
    label: Systolic blood pressure
    loinc: "8480-6"
    unit: mmHg
    alt_units: {"mm[Hg]": 1.0}
    valid_range: [50, 260]
    threshold: 140
    bad_direction: up
    goals: [lower_bp]

  diastolic_bp:
    label: Diastolic blood pressure
    loinc: "8462-4"
    unit: mmHg
    alt_units: {"mm[Hg]": 1.0}
    valid_range: [30, 160]
    threshold: 90
    bad_direction: up
    goals: [lower_bp]

  heart_rate:
    label: Heart rate
    loinc: "8867-4"
    unit: /min
    alt_units: {"beats/min": 1.0, "{beats}/min": 1.0}
    valid_range: [25, 250]
    threshold: null          # no urgency threshold
    bad_direction: up
    goals: [more_activity]

  body_weight:
    label: Body weight
    loinc: "29463-7"
    unit: kg
    alt_units: {"lb": 0.45359237, "[lb_av]": 0.45359237, "g": 0.001}
    valid_range: [0.5, 350]    # includes low-birth-weight newborns
    threshold: null          # BMI carries the threshold
    bad_direction: up
    goals: [weight_loss]

  bmi:
    label: Body mass index
    loinc: "39156-5"
    unit: kg/m2
    alt_units: {"kg/m2": 1.0}
    valid_range: [10, 80]
    threshold: 30
    bad_direction: up
    goals: [weight_loss]

  hba1c:
    label: HbA1c
    loinc: "4548-4"
    unit: "%"
    alt_units: {"%": 1.0}
    valid_range: [2, 20]       # Synthea produces 2.4-2.9 for some healthy patients
    threshold: 6.5
    bad_direction: up
    goals: [glucose_control]

  glucose:
    label: Glucose
    loinc: "2339-0"
    loinc_aliases: ["2345-7"]   # Synthea also records serum/plasma glucose under this code
    unit: mg/dL
    alt_units: {"mmol/L": 18.016}
    valid_range: [20, 800]
    threshold: 126
    bad_direction: up
    goals: [glucose_control]

  total_cholesterol:
    label: Total cholesterol
    loinc: "2093-3"
    unit: mg/dL
    alt_units: {"mmol/L": 38.67}
    valid_range: [50, 600]
    threshold: 240
    bad_direction: up
    goals: [lower_bp]        # proxy: cardiovascular goal

  ldl:
    label: LDL cholesterol
    loinc: "18262-6"
    unit: mg/dL
    alt_units: {"mmol/L": 38.67}
    valid_range: [10, 400]
    threshold: 160
    bad_direction: up
    goals: [lower_bp]

  hdl:
    label: HDL cholesterol
    loinc: "2085-9"
    unit: mg/dL
    alt_units: {"mmol/L": 38.67}
    valid_range: [5, 150]
    threshold: 40
    bad_direction: down
    goals: [lower_bp, more_activity]

  # Synthetic lifestyle metrics (no LOINC; generated by synth_lifestyle.py)
  sleep_hours:
    label: Sleep duration
    loinc: null
    unit: h
    alt_units: {"min": 0.0166666667}
    valid_range: [0, 16]
    threshold: 6
    bad_direction: down
    goals: [better_sleep]

  steps:
    label: Daily steps
    loinc: null
    unit: steps/day
    alt_units: {}
    valid_range: [0, 60000]
    threshold: 5000
    bad_direction: down
    goals: [more_activity, weight_loss]

# Temporal engine parameters (build plan 5.1 and 5.2)
temporal:
  lambda_base: 0.0019          # per day; about a 1-year half-life before volatility scaling
  volatility_clip: [0.25, 4.0]
  trend_window_years: 5
  trend_min_points: 3
  trend_full_confidence_points: 5
  trend_min_span_years: 1.0     # readings bunched in a short stay (e.g. hospital) cannot give a yearly trend

  # floor_e = severity_e * persistence_e
  event_types:
    observation:      {persistence: 0.0, severity: 0.0}
    allergy:          {persistence: 1.0, severity: 1.0}
    chronic_condition: {persistence: 1.0, severity: 0.8}
    resolved_major:   {persistence: 0.5, severity: 0.6}   # e.g. surgery, resolved MI episode
    acute_condition:  {persistence: 0.0, severity: 0.3}
    social_finding:   {persistence: 0.0, severity: 0.0}   # employment, housing, etc. (not clinical)
    medication:       {persistence: 0.0, severity: 0.5}   # weighted by active status instead
    lifestyle:        {persistence: 0.0, severity: 0.0}

  # Condition classification (lower-case substring match on the Synthea description).
  # Order: social -> history -> ongoing = chronic; resolved + major keyword = resolved_major; else acute.
  social_keywords: [employment, education, educated, school, criminal record, social isolation,
                    social contact, housing, transport, labor force, unemployed, refugee, military,
                    medication review due, violence, abuse, risk activity, stress (finding)]
  history_prefixes: ["history of", "past pregnancy history"]
  major_event_keywords: [myocardial infarction, cardiac arrest, stroke, fracture, bypass, transplant,
                         sepsis, spinal cord, brain injury, neoplasm, pulmonary embolism]

  # W_e = w_recency * goal_relevance_e
  goal_relevance: {match: 1.0, other: 0.6}
  # Conditions that relate to a user goal (for goal_relevance)
  condition_goals:
    lower_bp: [hypertension, hyperlipidemia, ischemic heart, myocardial infarction, heart failure, coronary]
    glucose_control: [diabetes, prediabetes, hyperglycemia, metabolic syndrome]
    weight_loss: [obesity, obese, metabolic syndrome]
    better_sleep: [sleep, insomnia, apnea]
    more_activity: [osteoporosis, chronic pain, low back pain]

  # Lifestyle metrics are daily and noisy: trends and volatility use weekly means.
  lifestyle_resample: W

goals: [weight_loss, lower_bp, better_sleep, more_activity, glucose_control]
